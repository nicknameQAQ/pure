name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.9.0'
          cache: npm
      - run: npm ci
      - run: npm test -- --pool=threads --maxWorkers=1
      - run: npm run build
      - run: node tests/e2e.mjs
      - run: node tests/features.mjs
      - run: node tests/workspace.mjs
      - name: Package Windows downloads
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag/package version mismatch" }
          node scripts/prepare-dist.mjs
          npx electron-builder --win portable zip --x64 --publish never --config.electronDist=node_modules/electron/dist
          npm run release:assets
      - name: Validate packaged application
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:PURE_TEST_EXECUTABLE = Join-Path $PWD 'release/win-unpacked/pure.exe'
          node tests/workspace.mjs
          node tests/features.mjs
          node tests/e2e.mjs
          node tests/portable.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-release
          compression-level: 0
          path: |
            release/pure-*-win-x64.zip
            release/pure-*-x64-portable.exe
            release/pure-*-source.zip
            release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-diagnostics
          path: test-results
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release
          path: release
      - name: Publish verified downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; keep previously verified assets.'; exit 0 }
          gh release create $tag --repo $env:GH_REPO --verify-tag --draft --title "pure $tag" --notes-file docs/RELEASE.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag release/* --repo $env:GH_REPO
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --repo $env:GH_REPO --draft=false --latest
